# fly.toml app configuration file generated for sep-rep-learning-webapp on 2026-09-21T04:03:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sep-rep-learning-webapp'
primary_region = 'ams'

[build]

[env]
  EPISODE_TIMESTEPS = '200'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'performance-8x'
